<div align="center">
  <br>
  <svg width="400" height="40" xmlns="http://www.w3.org/2000/svg">
    <style>
      .icon { animation: wobble 2s linear infinite; transform-origin: center; }
      @keyframes wobble {
        0%, 100% { transform: rotate(0deg) translateY(0px); }
        25% { transform: rotate(-10deg) translateY(-2px); }
        75% { transform: rotate(10deg) translateY(2px); }
      }
    </style>
    
    <text x="50%" y="25" font-family="monospace" font-size="24" text-anchor="middle">
      <tspan class="icon">💰</tspan>
      <tspan dy="-2"> ━━ </tspan>
      <tspan class="icon" style="animation-delay: 0.5s;">🛡️</tspan>
      <tspan dy="2"> ━━ </tspan>
      <tspan class="icon" style="animation-delay: 1s;">💼</tspan>
      <tspan dy="-2"> ━━ </tspan>
      <tspan class="icon" style="animation-delay: 1.5s;">🛡️</tspan>
      <tspan dy="2"> ━━ </tspan>
      <tspan class="icon">💰</tspan>
    </text>
  </svg>
  <br>
</div>