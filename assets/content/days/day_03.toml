day = 3
title = "Сложная пятница"
intro = """К пятнице кейсы перестают быть учебно-чистыми. Теперь стол проверяет не только факт события, но и серые зоны: насколько внезапным оно было, не подвёл ли клиент сам себя дисциплиной и не разрушает ли историю позднее обращение."""
pacing = "Плотный и нервный день, где важны нюансы формулировок и поведение клиента."
theory = """Серые зоны редко ломаются одним документом. Нужно смотреть на поведение клиента до и после события: как быстро он сообщил, насколько последовательно описывает обстоятельства и не оставил ли сам слишком большую дыру в дисциплине. В таких кейсах аккуратность важнее уверенности."""
bullet_points = [
  "Внезапность подтверждается не только событием, но и тем, как быстро клиент на него отреагировал.",
  "Позднее обращение не всегда убивает кейс, но резко повышает требования к доказательствам.",
  "Серые зоны требуют отделять сочувствие к клиенту от качества пакета.",
  "Если история меняется после уточнения, стол почти всегда становится жёстче.",
]

[[cases]]
id = "smoke-computer"
visitor = "Олег, 36 лет, преподаватель"
story = """У соседей снизу случилось возгорание на кухне, открытого огня у Олега в квартире не было, но через вентиляцию и щель в двери в комнату с компьютером пошёл густой едкий дым. На следующий день системный блок начал шуметь, а позже стал самопроизвольно выключаться."""
facts = [
  "Пожар был у соседей, но задымление затронуло и квартиру Олега.",
  "Есть справка пожарной службы и фото копоти на решётке вентиляции.",
  "Компьютер перестал работать не мгновенно, а после ночи в задымлённой комнате.",
]
documents = [
  { id = "smoke-fire", label = "Справка пожарной службы", kind = "Пожарная служба", summary = "Подтверждает возгорание у соседей и факт задымления лестничной клетки и смежных квартир.", expected_zone = "proof" },
  { id = "smoke-photos", label = "Фото копоти на решётке и корпусе", kind = "Фотофиксация", summary = "На фото заметны свежие следы копоти на вентиляции и верхней панели корпуса.", expected_zone = "proof" },
  { id = "smoke-service", label = "Заключение сервиса", kind = "Сервис", summary = "Внутри корпуса обнаружена сажа и следы загрязнения контактов после дымового воздействия.", expected_zone = "proof" },
  { id = "smoke-receipt", label = "Чек на компьютер", kind = "Покупка", summary = "Подтверждает состав и стоимость системного блока.", expected_zone = "watch" },
]
clarification = { question = "Пытался ли Олег продолжать пользоваться компьютером несколько дней после задымления?", answer = "Нет. Он включил его только на следующее утро, заметил сбои и после этого отключил и отвёз в сервис." }
outcome = { verdict = "approve", reason = "Хотя огонь не достиг самой квартиры, есть подтверждённое внешнее воздействие дымом, связанное по времени с последующей поломкой.", policy = "Серые зоны можно одобрять, если внешняя причина подтверждена третьими лицами и поведение клиента после события было дисциплинированным." }

[[cases]]
id = "late-camera-theft"
visitor = "Вера, 28 лет, фотограф"
story = """Вера заявляет кражу камеры из кафе, где якобы оставила рюкзак на стуле у окна. Проблема в том, что заявление в полицию она подала только через двенадцать дней, а до этого надеялась, что камеру «кто-то вернёт через знакомых»."""
facts = [
  "Обращение в полицию сильно запоздало.",
  "Серийный номер камеры в заявлении изначально не был указан.",
  "В истории есть временной разрыв между якобы кражей и первым формальным действием.",
]
documents = [
  { id = "camera-police", label = "Заявление в полицию", kind = "Полиция", summary = "Оформлено через двенадцать дней после предполагаемой кражи.", expected_zone = "exception" },
  { id = "camera-cafe", label = "Чек из кафе", kind = "Таймлайн", summary = "Подтверждает, что Вера действительно была в кафе в нужный день.", expected_zone = "watch" },
  { id = "camera-gallery", label = "Облачная галерея камеры", kind = "Метаданные", summary = "Последняя синхронизация с камеры произошла через три дня после заявленного момента кражи.", expected_zone = "exception" },
  { id = "camera-box", label = "Фото коробки без серийника в обращении", kind = "Покупка", summary = "Серийный номер есть на коробке, но не был сразу указан в первичном обращении.", expected_zone = "watch" },
]
clarification = { question = "Почему официальное обращение было подано так поздно, если вещь профессиональная и дорогая?", answer = "Вера сказала, что сначала пыталась найти камеру через знакомых и только потом решила оформлять кражу официально." }
outcome = { verdict = "reject", reason = "Позднее обращение, разрыв в таймлайне и метаданные, не совпадающие с версией клиента, делают историю слишком слабой.", policy = "В серых кейсах дисциплина клиента критична: чем позже формальное действие, тем выше планка к доказательствам." }

[[cases]]
id = "fracture-camp"
visitor = "Глеб, 17 лет, через родителя"
story = """За день до выезда в спортивный лагерь Глеб упал на тренировке и получил перелом кисти. Мать просит компенсировать невозвратную часть путёвки и уже приложила документы из травмпункта."""
facts = [
  "Травма произошла накануне начала лагеря.",
  "Врач прямо запретил нагрузку и поездку.",
  "Организатор лагеря удержал часть стоимости по правилам тарифа.",
]
documents = [
  { id = "camp-er", label = "Справка травмпункта", kind = "Медицина", summary = "Оформлена вечером накануне выезда, указан свежий перелом кисти.", expected_zone = "proof" },
  { id = "camp-xray", label = "Описание рентгена", kind = "Медицина", summary = "Подтверждает перелом и иммобилизацию кисти.", expected_zone = "proof" },
  { id = "camp-organizer", label = "Ответ организатора лагеря", kind = "Организатор", summary = "Организатор подтверждает удержание невозвратной части по тарифу после поздней отмены.", expected_zone = "proof" },
  { id = "camp-payment", label = "Квитанция об оплате путёвки", kind = "Оплата", summary = "Подтверждает сумму и дату оплаты лагеря.", expected_zone = "watch" },
]
clarification = { question = "Когда врач впервые запретил поездку: уже после оплаты или ещё до неё?", answer = "Запрет появился только после травмы накануне выезда; до этого медицинских ограничений не было." }
outcome = { verdict = "approve", reason = "Есть внезапная травма, зафиксированная медиками в нужный момент, и понятный финансовый остаток по отменённой поездке.", policy = "Даже в сложный день внезапная и хорошо документированная медицинская причина остаётся сильным основанием для одобрения." }

[[cases]]
id = "stored-jacket"
visitor = "Инна, 33 года, продакт-менеджер"
story = """Инна достала дорогую куртку из шкафа после сезона и обнаружила на рукавах потёртости, отслаивание покрытия и жёсткие светлые пятна по швам. Она говорит, что куртка «испортилась сама по себе во время хранения»."""
facts = [
  "Нет внезапного момента повреждения.",
  "Куртка хранилась несколько месяцев в обычном шкафу.",
  "Специалист химчистки указывает на постепенную деградацию покрытия и влажность.",
]
documents = [
  { id = "jacket-cleaner", label = "Заключение химчистки", kind = "Химчистка", summary = "Указаны следы длительного хранения во влажной среде и возрастное разрушение покрытия.", expected_zone = "exception" },
  { id = "jacket-photos", label = "Фото рукавов и швов", kind = "Фотофиксация", summary = "Повреждения распределены по краям и сгибам, без одного центра удара.", expected_zone = "exception" },
  { id = "jacket-receipt", label = "Чек на куртку", kind = "Покупка", summary = "Подтверждает цену и бренд вещи.", expected_zone = "watch" },
  { id = "jacket-claim", label = "Текст обращения", kind = "Заявление", summary = "Инна не указывает ни одного события, только факт обнаружения после хранения.", expected_zone = "exception" },
]
clarification = { question = "Был ли эпизод затопления, пожара, кражи или иного внешнего воздействия на место хранения?", answer = "Нет. Шкаф не затапливало и ничего внезапного с ним не происходило." }
outcome = { verdict = "reject", reason = "Картина соответствует хранению и постепенной деградации материала, а не внезапному покрываемому событию.", policy = "Когда вещь портится во времени без внешнего инцидента, это не страховой случай, даже если убыток для клиента неприятен." }

[[cases]]
id = "storm-violin"
visitor = "Лев, 40 лет, музыкант"
story = """Во время сильного шторма в съёмной студии выбило окно. На следующий день Лев нашёл скрипку в мокром футляре: по лаку пошли вздутия, внутри появилась влага, а подставка перекосилась."""
facts = [
  "Шторм официально отмечен метеослужбой.",
  "Окно было закрыто, стекло разбило порывом ветра.",
  "Инструмент лежал в футляре у стены рядом с окном.",
]
documents = [
  { id = "violin-weather", label = "Сводка метеослужбы", kind = "Погода", summary = "Зафиксированы шквальные порывы ветра в ночь события.", expected_zone = "proof" },
  { id = "violin-window", label = "Фото выбитого окна и мокрого футляра", kind = "Фотофиксация", summary = "На фото видны осколки, следы воды и намокший футляр у стены.", expected_zone = "proof" },
  { id = "violin-luthier", label = "Смета мастера по инструментам", kind = "Мастерская", summary = "Повреждения лака и деформация подставки соответствуют намоканию и перепаду влажности.", expected_zone = "proof" },
  { id = "violin-landlord", label = "Сообщение арендодателя", kind = "Арендодатель", summary = "Арендодатель подтверждает, что стекло выбило ветром ночью, а не по вине арендатора.", expected_zone = "proof" },
]
clarification = { question = "Было ли окно оставлено открытым самим Львом?", answer = "Нет. По словам Льва и арендодателя, окно было закрыто, а стекло выбило порывом во время шторма." }
outcome = { verdict = "approve", reason = "Есть внезапное погодное событие, понятная точка входа ущерба и подтверждения от метеослужбы, мастера и арендодателя.", policy = "Сильный серый кейс становится чистым, когда дисциплина клиента сохранена, а внешний фактор подтверждён несколькими источниками." }
