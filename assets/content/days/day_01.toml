day = 1
title = "Первая смена"
intro = """Первый день выглядит спокойным, но именно здесь закладывается дисциплина: оператор не угадывает, а ищет внезапное событие, проверяемые доказательства и явные исключения."""
pacing = "Спокойный вводный поток, где важнее метод, чем скорость."
theory = """Базовая логика смены проста: сначала ищем внешний триггер, потом проверяем документы на связность, а уже после этого решаем, не уводит ли кейс в исключения. Хороший пакет не обязан быть идеальным, но он обязан складываться в убедимую историю."""
bullet_points = [
  "Не путайте сам факт ущерба с подтверждением причины ущерба.",
  "Чек помогает идентифицировать вещь, но не доказывает само событие.",
  "Если причина чисто личная или бытовая без внешнего фактора, ищите исключение.",
  "Один сильный документ часто важнее трёх шумных, но расплывчатых карточек.",
]

[[cases]]
id = "bike-phone"
visitor = "Артём, 24 года, студент и велокурьер"
story = """Артём принес телефон с паутиной трещин на экране. Говорит, что вечером возвращался на велосипеде, на мокрой плитке перед спуском переднее колесо сорвалось, он ударился плечом и телефон вылетел из кармана на асфальт."""
facts = [
  "Падение произошло в тот же вечер, заявление подано утром.",
  "Экран разбит, корпус поцарапан с одного угла.",
  "Клиент не просит компенсацию велосипеда, только телефона.",
]
documents = [
  { id = "bike-phone-receipt", label = "Чек на телефон", kind = "Покупка", summary = "Модель и стоимость совпадают, устройство куплено семь месяцев назад.", expected_zone = "watch" },
  { id = "bike-phone-photo", label = "Фото телефона на асфальте", kind = "Фотофиксация", summary = "На снимке видны свежие трещины и влажная плитка, время совпадает с историей.", expected_zone = "proof" },
  { id = "bike-phone-service", label = "Акт сервиса о точечном ударе", kind = "Сервис", summary = "Сервис пишет о свежем ударном повреждении без признаков старого дефекта.", expected_zone = "proof" },
  { id = "bike-phone-route", label = "Маршрут поездки из фитнес-приложения", kind = "Таймлайн", summary = "Останавливается в районе спуска в 21:14, затем движение обрывается.", expected_zone = "proof" },
]
clarification = { question = "Почему в заявлении сразу не было фото велосипеда?", answer = "Артём объяснил, что велосипед цел, а фото телефона и места падения сделал на телефон подруги уже через несколько минут." }
outcome = { verdict = "approve", reason = "Есть внезапное внешнее событие, свежая фотофиксация и сервисное подтверждение ударного характера повреждения.", policy = "Для базового покрытия важны внезапность и подтверждённая причинно-следственная связь, а не идеальный пакет без единого пробела." }

[[cases]]
id = "trip-no-reason"
visitor = "Елена, 32 года, продюсер"
story = """Елена просит компенсировать сорванную поездку в Вильнюс. Билеты и бронь были оплачены заранее, но за день до выезда она решила не ехать, потому что почувствовала, что «поездка перестала быть правильной идеей»."""
facts = [
  "Авиакомпания рейс не отменяла.",
  "Медицинских документов или форс-мажора нет.",
  "Заявление написано аккуратно и без противоречий.",
]
documents = [
  { id = "trip-booking", label = "Подтверждение брони гостиницы", kind = "Бронь", summary = "Подтверждает существование поездки, но не объясняет причину отмены.", expected_zone = "watch" },
  { id = "trip-chat", label = "Переписка с подругой", kind = "Переписка", summary = "Елена пишет, что просто передумала и хочет остаться дома.", expected_zone = "exception" },
  { id = "trip-weather", label = "Скрин погоды в день вылета", kind = "Фон", summary = "Погода в норме, предупреждений и стихийных причин нет.", expected_zone = "watch" },
  { id = "trip-airline", label = "Подтверждение, что рейс по расписанию", kind = "Перевозчик", summary = "Авиакомпания пишет, что регистрация открылась вовремя и отмен не было.", expected_zone = "proof" },
]
clarification = { question = "Была ли внешняя причина: болезнь, травма, отмена мероприятия или транспортный сбой?", answer = "Елена подтвердила, что ничего внешнего не произошло: она просто не захотела лететь." }
outcome = { verdict = "reject", reason = "Поездка сорвалась по личному решению клиента без внешней причины, на которую распространялось бы покрытие.", policy = "Факт оплаченной поездки сам по себе не создаёт страховой случай. Нужен внешний триггер, а не перемена настроения." }

[[cases]]
id = "sweet-tea-laptop"
visitor = "Кирилл, 29 лет, дизайнер"
story = """Кирилл поставил ноутбук на кухонный стол, рядом стояла кружка сладкого чая. Во время созвона он задел кружку локтем, жидкость ушла под клавиатуру, а через пару часов ноутбук перестал включаться."""
facts = [
  "Пролит именно сладкий чай, не вода.",
  "Клиент сразу поехал в сервис и приложил смету ремонта.",
  "В полисе стартового дня нет расширения на бытовые залития сладкими жидкостями.",
]
documents = [
  { id = "tea-repair", label = "Смета сервиса", kind = "Сервис", summary = "Указана липкая коррозия после сладкой жидкости и замена нескольких модулей.", expected_zone = "exception" },
  { id = "tea-photo", label = "Фото клавиатуры с липкими следами", kind = "Фотофиксация", summary = "Подтверждает сам инцидент, но одновременно указывает на бытовое залитие.", expected_zone = "watch" },
  { id = "tea-receipt", label = "Чек на ноутбук", kind = "Покупка", summary = "Подтверждает устройство и цену, куплен год назад.", expected_zone = "watch" },
  { id = "tea-note", label = "Комментарий клиента о пролитом чае", kind = "Заявление", summary = "Кирилл честно описывает, что сам опрокинул кружку во время разговора.", expected_zone = "exception" },
]
clarification = { question = "Есть ли у полиса опция расширенного покрытия на бытовые залития?", answer = "Нет, в пакете только стандартный набор без дополнительной опции на сладкие жидкости и бытовые проливы." }
outcome = { verdict = "reject", reason = "Причина ущерба подтверждена, но сам тип события попадает в исключение стартового покрытия.", policy = "Иногда кейс хорошо доказан, но всё равно уходит в отказ, если причина прямо исключена условиями пакета." }

[[cases]]
id = "missing-earbud"
visitor = "Саша, 21 год, студентка"
story = """Саша заявляет пропажу одного наушника из пары. По её словам, вечером после прогулки в кейсе оказался только правый наушник, а левый бесследно исчез."""
facts = [
  "Нет момента кражи или падения, только обнаружение потери позже.",
  "Пропал один элемент комплекта, кейс и второй наушник на месте.",
  "Сама пара исправна частично, но событие не локализовано по времени.",
]
documents = [
  { id = "earbud-app", label = "Скрин приложения производителя", kind = "Приложение", summary = "Виден только правый наушник, левый давно не подключался.", expected_zone = "watch" },
  { id = "earbud-case", label = "Фото кейса с одним наушником", kind = "Фотофиксация", summary = "Подтверждает частичную пропажу, но не причину и не момент события.", expected_zone = "watch" },
  { id = "earbud-receipt", label = "Чек на комплект", kind = "Покупка", summary = "Подтверждает, что комплект действительно был у клиента.", expected_zone = "watch" },
  { id = "earbud-statement", label = "Текст заявления", kind = "Заявление", summary = "Содержит только факт позднего обнаружения пропажи без внешней причины.", expected_zone = "exception" },
]
clarification = { question = "Есть ли место и момент, где пропажа могла быть зафиксирована как кража или падение?", answer = "Нет. Саша заметила отсутствие только дома и не может указать ни точку, ни время." }
outcome = { verdict = "reject", reason = "Нет подтверждённого события, нет признаков кражи и отсутствует внешняя причина ущерба.", policy = "Позднее обнаружение одной детали без события и без подтверждений не формирует страховой случай." }

[[cases]]
id = "pool-bike"
visitor = "Никита, 35 лет, маркетолог"
story = """Никита приехал на велосипеде в бассейн, оставил его у ограды спортивного комплекса и через полтора часа не нашёл на месте. Он считает, что велосипед украли, и просит полное возмещение."""
facts = [
  "Велосипед был оставлен без замка, только прислонён к ограде.",
  "Клиент сначала искал сам, а к администратору подошёл только через час.",
  "Камер на самой стойке нет, только обзорные у входа.",
]
documents = [
  { id = "pool-pass", label = "Электронный браслет бассейна", kind = "Таймлайн", summary = "Подтверждает, что Никита действительно находился внутри комплекса.", expected_zone = "watch" },
  { id = "pool-photo", label = "Фото велосипеда без замка", kind = "Фотофиксация", summary = "На старом фото у входа видно, что велосипед обычно оставляли просто у ограды.", expected_zone = "exception" },
  { id = "pool-admin", label = "Записка администратора", kind = "Служебная заметка", summary = "Администратор подтверждает позднее обращение и отсутствие точного времени пропажи.", expected_zone = "exception" },
  { id = "pool-receipt", label = "Чек на велосипед", kind = "Покупка", summary = "Помогает идентифицировать объект, но не доказывает саму кражу.", expected_zone = "watch" },
]
clarification = { question = "Был ли велосипед пристёгнут или передан на охраняемую стоянку?", answer = "Нет, Никита оставил его без замка у ограды, потому что рассчитывал быть внутри недолго." }
outcome = { verdict = "reject", reason = "Даже если пропажа реальна, клиент оставил велосипед без базовой защиты, а это уводит кейс в исключение по грубой неосторожности.", policy = "Когда объект оставлен в уязвимой ситуации без минимальных мер защиты, пакет стартового дня не покрывает убыток." }
