day = 2
title = "Очередь после ливня"
intro = """После ночного ливня поток заявлений стал нервным: у всех есть ощущения и убытки, но оператору важны сроки, последовательность подтверждений и то, как одно доказательство поддерживает другое."""
pacing = "Темп выше: главное не терять хронологию и проверять цепочку подтверждений."
theory = """Во второй день стол учит таймлайну. Документы должны не просто существовать, а подпирать друг друга по времени: событие, фиксация, обращение, подтверждение от третьей стороны. Если цепочка рвётся, уверенность в кейсе падает."""
bullet_points = [
  "Сверяйте время события с временем первого обращения и первой фиксации.",
  "Отдельный документ может быть слабым, но сильная цепочка делает кейс убедительным.",
  "Подтверждение от перевозчика, управляющей компании или сервиса почти всегда усиливает пакет.",
  "Износ и личные решения не становятся покрытием только потому, что приложены аккуратные скриншоты.",
]

[[cases]]
id = "night-flood-tablet"
visitor = "Полина, 27 лет, иллюстратор"
story = """Полина оставила планшет на прикроватной тумбе, а ночью сверху прорвало шланг в квартире соседей. Утром устройство было мокрым по краям, тач не реагировал, а по стене шла свежая полоса воды."""
facts = [
  "Залитие зафиксировано утром сразу после обнаружения.",
  "Есть акт управляющей компании и фото комнаты.",
  "Планшет не носили в сервис до фотофиксации квартиры.",
]
documents = [
  { id = "flood-act", label = "Акт управляющей компании", kind = "УК", summary = "Фиксирует ночное затопление и источник воды из квартиры этажом выше.", expected_zone = "proof" },
  { id = "flood-photo", label = "Фото тумбы и мокрого планшета", kind = "Фотофиксация", summary = "Видны лужа, след на стене и вода возле устройства, время на снимках совпадает с утром обнаружения.", expected_zone = "proof" },
  { id = "flood-neighbor", label = "Сообщение от соседей сверху", kind = "Переписка", summary = "Соседи признают, что ночью у них сорвало шланг стиральной машины.", expected_zone = "proof" },
  { id = "flood-service", label = "Заключение сервиса", kind = "Сервис", summary = "Коррозия свежая, характер повреждения соответствует недавнему контакту с водой.", expected_zone = "proof" },
]
clarification = { question = "Когда именно планшет впервые перестал реагировать: до вызова УК или уже после?", answer = "Полина заметила отказ тача сразу утром, а управляющую компанию вызвала уже после фотофиксации комнаты." }
outcome = { verdict = "approve", reason = "Есть непрерывная цепочка: внешнее событие ночью, фото утром, акт УК и сервисное подтверждение свежего залития.", policy = "Во втором дне особенно ценится связность таймлайна: сторонние подтверждения делают кейс сильным." }

[[cases]]
id = "concert-friend"
visitor = "Марина, 30 лет, менеджер по продажам"
story = """Марина планировала поездку на концерт в Казань, но в последний момент её друг, с которым они ехали вместе, отказался. Она решила не ехать одна и теперь просит компенсировать билеты и бронь."""
facts = [
  "Концерт не отменяли и переносов не было.",
  "Транспорт работал штатно.",
  "Причина отказа от поездки связана с изменением планов друга.",
]
documents = [
  { id = "concert-ticket", label = "Билеты на концерт", kind = "Билеты", summary = "Подтверждают, что поездка и мероприятие были реальными.", expected_zone = "watch" },
  { id = "concert-chat", label = "Голосовое сообщение друга", kind = "Переписка", summary = "Друг пишет, что просто передумал ехать и останется дома.", expected_zone = "exception" },
  { id = "concert-hotel", label = "Бронь отеля без возврата", kind = "Бронь", summary = "Показывает размер убытка, но не создаёт покрываемую причину.", expected_zone = "watch" },
  { id = "concert-event", label = "Письмо площадки", kind = "Организатор", summary = "Организатор подтверждает, что концерт прошёл по расписанию.", expected_zone = "proof" },
]
clarification = { question = "Был ли у самой Марины внешний запрет на поездку: травма, болезнь, отмена транспорта?", answer = "Нет. Она решила не ехать только потому, что спутник отказался." }
outcome = { verdict = "reject", reason = "Поездка сорвалась из-за личного решения после отказа друга, а не из-за внешнего покрываемого события.", policy = "Цепочка документов может быть аккуратной, но личная причина всё равно ведёт в отказ." }

[[cases]]
id = "delayed-baggage"
visitor = "Роберт, 41 год, инженер"
story = """Роберт прилетел в Барселону, но чемодан не вышел на ленту. На стойке розыска багажа оформили заявление, а вещи доставили в отель только спустя двое суток."""
facts = [
  "Заявление о задержке оформлено сразу в аэропорту прилёта.",
  "Есть бирка багажа и номер PIR.",
  "Роберт заявляет только расходы на необходимый минимум вещей на первые двое суток.",
]
documents = [
  { id = "baggage-pir", label = "PIR из аэропорта", kind = "Аэропорт", summary = "Оформлен в день прилёта, фиксирует отсутствие чемодана на ленте.", expected_zone = "proof" },
  { id = "baggage-tag", label = "Багажная бирка", kind = "Перевозка", summary = "Подтверждает, что чемодан был зарегистрирован на рейс.", expected_zone = "proof" },
  { id = "baggage-mail", label = "Письмо авиакомпании о доставке", kind = "Перевозчик", summary = "Авиакомпания сообщает о доставке багажа в отель через два дня.", expected_zone = "proof" },
  { id = "baggage-receipts", label = "Чеки на базовые вещи", kind = "Расходы", summary = "Футболка, бельё и средства гигиены в пределах разумного минимума.", expected_zone = "watch" },
]
clarification = { question = "Покупались ли вещи класса люкс или только базовый минимум на время задержки?", answer = "Только вещи первой необходимости. Роберт специально не включал одежду дороже обычного повседневного уровня." }
outcome = { verdict = "approve", reason = "Есть непрерывная цепочка подтверждений от перевозчика: регистрация багажа, заявление о задержке и подтверждение фактической доставки позже.", policy = "Когда третья сторона подтверждает сбой по времени, кейс становится одним из самых чистых во всём дне." }

[[cases]]
id = "false-delivery"
visitor = "Лиза, 26 лет, архитектор"
story = """Лиза заказала графический контроллер, в приложении курьера появилась отметка «доставлено», но коробка так и не появилась у двери. Она утверждает, что весь вечер была дома и никто не звонил в домофон."""
facts = [
  "Статус доставки изменился на «доставлено» в 19:42.",
  "Домофон и камера подъезда сохраняют журнал событий.",
  "Соседи по площадке ничего не принимали.",
]
documents = [
  { id = "delivery-app", label = "Скрин статуса доставки", kind = "Приложение", summary = "Отмечено «доставлено», но без фото вручения и без подписи клиента.", expected_zone = "watch" },
  { id = "delivery-intercom", label = "Журнал домофона", kind = "Домофон", summary = "В 19:42 вызовов на квартиру не было.", expected_zone = "proof" },
  { id = "delivery-camera", label = "Кадр камеры площадки", kind = "Камера", summary = "В интервале отметки курьер на этаж не поднимался.", expected_zone = "proof" },
  { id = "delivery-chat", label = "Ответ курьерской службы", kind = "Служба доставки", summary = "Служба признаёт ошибочную отметку и отсутствие подтверждённого вручения.", expected_zone = "proof" },
]
clarification = { question = "Есть ли подтверждение, что кто-то получил посылку вместо клиента?", answer = "Нет. Служба доставки не смогла показать ни подпись, ни фото вручения, ни имя получателя." }
outcome = { verdict = "approve", reason = "Есть сильная цепочка, показывающая ложную отметку доставки без фактического вручения: приложение, домофон, камера и ответ службы.", policy = "Если временная линия согласована и третья сторона не может подтвердить вручение, убыток подлежит одобрению." }

[[cases]]
id = "watch-wear"
visitor = "Денис, 38 лет, юрист"
story = """Денис приносит наручные часы и говорит, что они «вдруг потеряли вид»: стекло затёрлось, корпус потускнел, а на браслете появились множественные царапины. Он настаивает, что ущерб проявился как бы одномоментно после обычной недели ношения."""
facts = [
  "Нет единственного момента удара или падения.",
  "Повреждения распределены по разным частям часов.",
  "В мастерской указали на накопленный износ.",
]
documents = [
  { id = "wear-jeweler", label = "Заключение часовщика", kind = "Мастерская", summary = "Указаны следы длительного ношения и микросколы от постепенного контакта.", expected_zone = "exception" },
  { id = "wear-photos", label = "Макрофото корпуса и браслета", kind = "Фотофиксация", summary = "Повреждения множественные и разнонаправленные, без одного центра удара.", expected_zone = "exception" },
  { id = "wear-receipt", label = "Гарантийный талон", kind = "Покупка", summary = "Подтверждает модель, но не причину ухудшения состояния.", expected_zone = "watch" },
  { id = "wear-claim", label = "Текст обращения клиента", kind = "Заявление", summary = "Нет конкретного события, только ощущение, что часы «сдали» за неделю.", expected_zone = "exception" },
]
clarification = { question = "Был ли эпизод внезапного удара, падения или попадания часов под внешнее воздействие?", answer = "Нет. Денис не вспомнил ни одного конкретного события, только обычное ежедневное ношение." }
outcome = { verdict = "reject", reason = "Повреждения выглядят как накопленный износ, а не как внезапное внешнее событие с ясной датой.", policy = "Цепочка подтверждений работает только там, где есть само покрываемое событие. Износ в неё не превращается." }
